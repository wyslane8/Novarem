<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UpcycleConnect - SALARIÉ</title>

    <!-- Importation de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/particulier.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">UpcycleConnect | Salarié</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <button class="nav-link" data-section="evenements">Événements</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-section="conseil">Conseils</button>
                    </li>
                </ul>

                <button class="btn btn-outline-secondary ms-auto" id="btn-logout">
                    Déconnexion
                </button>
            </div>
        </div>
    </nav>

    <!-- Gestion des événements -->
    <section id="section-evenements">
        <div class="container mt-4">

            <h1>Espace salarié UpcycleConnect</h1>
            <h2>Gestion des événements</h2>

            <!-- Tableau des événements -->
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Titre</th>
                            <th>Description</th>
                            <th>Date</th>
                            <th>Durée</th>
                            <th>Capacité Maximum</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableau-evenements"></tbody>
                </table>
            </div>

        </div>

        <!-- Ajouter un événement -->
        <h2 class="mt-4">Ajouter un événement</h2>

        <form id="form-evenement">

            <div class="mb-2">
                <input type="text" id="events_titre" placeholder="Titre" class="form-control" required>
            </div>

            <div class="mb-2">
                <input type="text" id="events_description" placeholder="Description" class="form-control" required>
            </div>

            <div class="mb-2">
                <input type="datetime-local" id="events_date" class="form-control" required>
            </div>

            <div class="mb-2">
                <input type="number" id="events_duree" placeholder="Durée" class="form-control" required>
            </div>

            <div class="mb-2">
                <input type="number" id="events_capacite_max" placeholder="Capacité maximum" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary">Créer</button>

        </form>
    </section>

    <!-- Gestion des conseils -->
    <section id="section-conseil">

        <div class="container mt-4">

            <h2>Gestion des conseils</h2>

            <!-- Ajouter un conseil -->
            <h3 class="mt-4">Ajouter un conseil</h3>

            <form id="form-conseil">

                <div class="mb-2">
                    <input type="text" id="conseil-titre" placeholder="Titre" class="form-control" required>
                </div>

                <div class="mb-2">
                    <input type="text" id="conseil-contenu" placeholder="Contenu" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">Créer</button>

            </form>

            <!-- Tableau des conseils -->
            <h3 class="mt-4">Liste des conseils</h3>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Titre</th>
                            <th>Contenu</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableau-conseils"></tbody>
                </table>
            </div>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/salarie.js"></script> 

</body>
</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>UpcycleConnect - ADMIN</title>
    <!-- Importation de Bootstrap via un serveur pas besoin d'installation -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="mb-4 border p-3">
        <h2>Connexion</h2>
        <form id="form-login">
            <div class="mb-2">
                <input type="email" id="login-email" placeholder="Email" class="form-control" required>
            </div>
            <div class="mb-2">
                <input type="password" id="login-mdp" placeholder="Mot de passe" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-secondary">Se connecter</button>
        </form>
        <p id="login-statut" class="mt-2"></p>
    </div>
    
    <script src="/static/login.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Espace Particulier - UpcycleConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/particulier.css" rel="stylesheet">
    <style>
        .tuto-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .tuto-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            text-align: center;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">UpcycleConnect</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <button class="nav-link" data-section="accueil">Accueil</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-section="depot">Dépôt</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-section="catalogue">Catalogue</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-section="conseil">Conseils</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-section="evenements">Evènements</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-section="profil">Profil</button>
                    </li>
                </ul>
                <button class="btn btn-outline-secondary ms-auto" id="btn-logout">Déconnexion</button>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <section id="section-accueil">
            <h1>Bonjour <span id="accueil-nom"></span></h1>
            <div class="card mt-3" style="max-width:300px">
                <div class="card-body text-center">
                    <h5 class="card-title">Mon Score</h5>
                    <p class="display-4" id="score-valeur">0</p>
                    <p class="text-muted">points</p>
                </div>
            </div>
            <div class="progress mt-3" style="max-width:300px">
                <div class="progress-bar" id="score-barre" role="progressbar" style="width: 0%"></div>
            </div>
            <h2 class="mt-4">Mes derniers dépôts</h2>
            <div id="accueil-depots"></div>
            <h2 class="mt-4">Mon planning</h2>
            <div id="accueil-planning"></div>
        </section>


        <section id="section-depot" class="d-none">
            <h1>Mes dépôts</h1>

            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>Titre</th>
                        <th>Description</th>
                        <th>Type</th>
                        <th>Prix</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableau-depots"></tbody>
            </table>

            <h2 class="mt-4">Déposer un objet</h2>
            <form id="form-depot">
                <div class="mb-2">
                    <input type="text" id="depot-titre" placeholder="Titre" class="form-control" required>
                </div>
                <div class="mb-2">
                    <input type="text" id="depot-description" placeholder="Description" class="form-control" required>
                </div>
                <div class="mb-2">
                    <select id="depot-type" class="form-control">
                        <option value="Mobilier">Mobilier</option>
                        <option value="Vêtements">Vêtements</option>
                        <option value="Électronique">Électronique</option>
                        <option value="Décoration">Décoration</option>
                    </select>
                </div>
                <div class="mb-2">
                    <input type="number" id="depot-prix" placeholder="Prix de vente" class="form-control" step="0.01"
                        min="0" required>
                </div>
                <button type="submit" class="btn btn-primary">Déposer</button>
            </form>
        </section>

        <section id="section-catalogue" class="d-none">
            <h1>Catalogue</h1>
            <input type="text" id="recherche-catalogue" placeholder="Rechercher...">
            <select id="filtre-categorie">
                <option value="">Toutes les catégories</option>
                <option value="Mobilier">Mobilier</option>
                <option value="Vêtements">Vêtements</option>
                <option value="Électronique">Électronique</option>
                <option value="Décoration">Décoration</option>
            </select>
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>Titre</th>
                        <th>Description</th>
                        <th>Type</th>
                        <th>Prix</th>
                    </tr>
                </thead>
                <tbody id="tableau-catalogue"></tbody>
            </table>

        </section>
        <section id="section-conseil" class="d-none">
            <h1>Conseils</h1>
            <div id="liste-conseils"></div>
        </section>
        <section id="section-evenements" class="d-none">
            <h1>Événements</h1>
            <div id="liste-evenements-dispo"></div>
        </section>
        <section id="section-profil" class="d-none">
            <h1>Mon profil</h1>

            <div class="card mb-4" style="max-width:500px">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-3">
                        <div class="ms-3">
                            <h4 class="mb-0" id="profil-affiche-nom"></h4>
                            <span class="badge bg-success" id="profil-affiche-role"></span>
                        </div>
                    </div>
                    <hr>
                    <p class="mb-1"><strong>Email :</strong> <span id="profil-affiche-email"></span></p>
                    <p class="mb-0"><strong>Membre depuis :</strong> <span id="profil-affiche-date"></span></p>
                </div>
            </div>

            <h2>Modifier mes informations</h2>

            <form id="form-profil">
                <!--margin bottom -->
                <div class="mb-2">
                    <!-- placeholder texte gris qui s'affcihe dans le champs vide != de label-->
                    <input type="text" id="profil-nom" placeholder="Nom" class="form-control" required>
                </div>
                <div class="mb-2">
                    <input type="email" id="profil-email" placeholder="Email" class="form-control" required>
                </div>
                <div class="mb-2">
                    <input type="password" id="profil-mdp" placeholder="Nouveau mot de passe" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary">Enregister</button>
            </form>
        </section>

    </main>

    <div id="tuto-overlay" class="tuto-overlay d-none">
        <div class="tuto-box">
            <h3 id="tuto-titre">Titre</h3>
            <p id=tuto-texte>Texte</p>
            <button class="btn btn-primary" id="tuto-suivant">Suivant</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/particulier.js"></script>
</body>

</html>
